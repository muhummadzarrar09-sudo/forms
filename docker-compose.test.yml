services:
  postgres:
    image: postgres:16-alpine
    container_name: forms-test-postgres
    environment:
      POSTGRES_USER: forms_test
      POSTGRES_PASSWORD: forms_test
      POSTGRES_DB: forms_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forms_test -d forms_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
